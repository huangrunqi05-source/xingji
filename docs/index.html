<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174b3d"><meta name="description" content="行迹：无需账号，保存在你设备上的私人探店本。记录到访、评分和照片。"><meta name="apple-mobile-web-app-capable" content="yes"><title>行迹 · 私人探店本</title><link rel="icon" href="./favicon.svg"><link rel="apple-touch-icon" href="./icon.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><a class="brand" href="./"><img src="./icon.png" alt=""><span>行迹<small>我的探店本</small></span></a><span class="privacy">仅存在本机</span></header><div class="heading"><div><p class="eyebrow">每一次到店，都值得留下</p><h1 id="page-title">我的足迹</h1></div><button class="primary" id="add">＋ 记一笔</button></div><p class="notice">记录和照片保存在当前设备的浏览器中，不上传 GitHub。请定期导出；清理网站数据、无痕浏览或更换设备可能导致记录丢失。</p><section id="stats" class="stats" aria-label="记录统计"></section><nav aria-label="主导航"><button data-tab="journal" aria-current="page">回顾</button><button data-tab="places">店铺</button><button data-tab="lists">清单</button><button data-tab="settings">设置</button></nav><div id="filters" class="filters"><input id="query" type="search" aria-label="搜索记录" placeholder="搜索店名、地址或感受"><select id="filter" aria-label="筛选记录"><option value="all">全部记录</option><option value="unrated">待评分</option><option value="loved">4 分及以上</option><option>餐厅</option><option>咖啡</option><option>购物</option><option>其他</option></select><input type="date" id="date" aria-label="到访日期"><button id="reset-filter" class="text-button">清除</button></div><p id="error" role="alert" hidden></p><section id="content" aria-live="polite"><p>正在读取本机记录…</p></section><footer><a href="https://github.com/huangrunqi05-source/xingji" target="_blank" rel="noreferrer">GitHub 源码</a> · 行迹本机版 <span id="offline"></span></footer></main><div id="toast" role="status" hidden></div><dialog id="editor" aria-labelledby="editor-title"><form id="visit-form"><div class="dialog-header"><h2 id="editor-title">记下这次到访</h2><button type="button" class="icon" data-close="editor" aria-label="关闭编辑">×</button></div><p class="hint">主动记录这次到店。拒绝定位也可以手动填写。</p><fieldset id="form-fields"><div class="actions"><button type="button" id="locate" class="secondary">获取当前位置</button><a class="text-button" href="https://uri.amap.com/search?keyword=美食&src=xingji&callnative=1" target="_blank" rel="noreferrer">去高德查店铺</a></div><p id="location-state" class="hint"></p><label>已有分店<select id="existing"><option value="">新店铺／手动填写</option></select></label><label>店铺名称 <span>*</span><input id="name" maxlength="100" required placeholder="例如：街角咖啡（中心店）"></label><label>分店地址<input id="address" maxlength="250" placeholder="填写地址，区分同名分店"></label><div class="columns"><label>类型<select id="category"><option>餐厅</option><option>咖啡</option><option>购物</option><option>其他</option></select></label><label>评分<select id="rating"><option value="">暂不评分</option></select></label></div><label>到达时间<input id="arrived" type="datetime-local" required></label><label>离开时间（可选）<input id="departed" type="datetime-local"></label><label>这次的感受<textarea id="note" maxlength="5000" rows="3" placeholder="喜欢的菜、座位、服务，或想记住的小事…"></textarea></label><div class="photo-header"><span>照片（最多 6 张）</span><label class="text-button file-label">＋ 添加照片<input id="photo-input" type="file" accept="image/*" multiple hidden></label></div><div id="photo-preview" class="photos"></div><p class="hint">照片在本机压缩并重新编码，不保留原始定位元数据。</p></fieldset><p id="save-error" class="error" hidden></p><button id="save" type="submit" class="primary wide">保存这次到访</button></form></dialog><dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><h2 id="detail-title">到访详情</h2><button class="icon" data-close="detail" aria-label="关闭详情">×</button></div><div id="detail-body"></div></dialog><dialog id="list-editor" aria-labelledby="list-title"><form id="list-form"><div class="dialog-header"><h2 id="list-title">新建清单</h2><button type="button" class="icon" data-close="list-editor" aria-label="关闭清单编辑">×</button></div><label>清单名称<input id="new-list-name" maxlength="60" required placeholder="例如：周末咖啡地图"></label><button class="primary wide">创建清单</button></form></dialog><dialog id="share-preview" aria-labelledby="share-title"><div class="dialog-header"><h2 id="share-title">预览清单内容</h2><button class="icon" data-close="share-preview" aria-label="关闭分享预览">×</button></div><p class="hint">仅复制以下内容，不包含坐标、精确时间或其他到访历史。</p><div id="share-body"></div><label>放入清单<select id="target-list"></select></label><button id="confirm-share" class="primary wide">确认加入清单</button></dialog><noscript>行迹需要启用 JavaScript 才能在本机保存记录。</noscript><script type="module" src="./app.js"></script></body></html>
